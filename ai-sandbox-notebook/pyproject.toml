[tool.poetry]
name = "ai-sandbox-notebook"
version = "0.0.3"
description = ""
authors = ["Hina <hinashah@renci.org>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"

# ── Jupyter Environment ──────────────────────────────────────────────────
jupyterlab = "4.4.7"
notebook = "7.4.5"
ipykernel = "7.2.0"
ipywidgets = "8.1.8"
ipython = "9.10.1"

# ── Azure Services (OCR & Infrastructure) ────────────────────────────────
azure-core = "1.35.0"
azure-identity = "^1.21.0"
azure-ai-formrecognizer = "^3.3.0"
azure-cognitiveservices-vision-computervision = "^0.9.0"
azure-storage-blob = "^12.25.0"
mistralai = "2.0.0"

# ── Image Processing ─────────────────────────────────────────────────────
pillow = "12.2.0"
pdf2image = "1.17.0"

# ── Geotagging & Mapping ─────────────────────────────────────────────────
exifread = "^3.1.0"
piexif = "^1.1.3"
geopy = "^2.4.0"
folium = "^0.19.0"

# ── Data Science & Visualization ─────────────────────────────────────────
numpy = "2.4.4"
pandas = "3.0.3"
matplotlib = "3.10.9"
seaborn = "0.13.2"
scipy = "1.17.1"
scikit-learn = "1.8.0"
altair = "5.5.0"

# ── NLP & Text Processing ────────────────────────────────────────────────
nltk = "3.9.1"
textblob = "0.19.0"
regex = "2026.4.4"

# ── LLM Integration (for post-OCR processing) ───────────────────────────
openai = "^2.22.0"
anthropic = "^0.66.0"
tiktoken = "^0.11.0"
litellm = "^1.83.7"
langchain = "^0.3.27"
langchain-core = "^0.3.75"
langchain-openai = "^0.3.32"
langchain-community = "^0.3.29"
langchain-text-splitters = "^0.3.11"

# ── Vector Search & Retrieval (if indexing OCR results) ──────────────────
faiss-cpu = "^1.12.0"
sentence-transformers = "5.5.0"

# ── Modeling ─────────────────────────────────────────────────────────────
vivarium-core = "^1.6.5"

# ── Deep Learning (PyTorch, CUDA 12.1) ───────────────────────────────────
torch = { version = "2.5.1+cu121", source = "pytorch-cu121" }
torchvision = { version = "0.20.1+cu121", source = "pytorch-cu121" }
torchaudio = { version = "2.5.1+cu121", source = "pytorch-cu121" }
transformers = "5.5.4"
accelerate = "1.13.0"
bitsandbytes = "0.49.2"
huggingface-hub = "1.10.2"
hf-xet = "1.4.3"
tokenizers = "0.22.2"
safetensors = "0.7.0"
qwen-vl-utils = "0.0.14"
av = "17.0.0"
umap-learn = "0.5.12"
pynndescent = "0.6.0"
numba = "0.65.1"
llvmlite = "0.47.0"

# ── Networking & HTTP ────────────────────────────────────────────────────
requests = "2.33.1"
httpx = "0.28.1"
aiohttp = "^3.12.0"

# ── Utilities ────────────────────────────────────────────────────────────
python-dotenv = "^1.1.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
tqdm = "4.67.3"
rich = "15.0.0"
beautifulsoup4 = "^4.13.0"
PyYAML = "6.0.3"
tabulate = "^0.9.0"
orjson = "^3.11.0"
Jinja2 = "3.1.6"
SQLAlchemy = "2.0.43"
psycopg2-binary = "2.9.10"
openpyxl = "3.1.5"

# ── Pinned transitive dependencies ───────────────────────────────────────
annotated-doc = "0.0.4"
anyio = "4.13.0"
asttokens = "3.0.1"
certifi = "2026.2.25"
charset-normalizer = "3.4.7"
click = "8.3.2"
comm = "0.2.3"
contourpy = "1.3.3"
cycler = "0.12.1"
debugpy = "1.8.20"
decorator = "5.2.1"
et-xmlfile = "2.0.0"
executing = "2.2.1"
filelock = "3.25.2"
fonttools = "4.62.1"
fsspec = "2026.3.0"
h11 = "0.16.0"
httpcore = "1.0.9"
idna = "3.11"
ipython-pygments-lexers = "1.1.1"
jedi = "0.19.2"
joblib = "1.5.3"
jupyter-client = "8.8.0"
jupyter-core = "5.9.1"
jupyterlab-widgets = "3.0.16"
kiwisolver = "1.5.0"
markdown-it-py = "4.0.0"
markupsafe = "3.0.3"
matplotlib-inline = "0.2.1"
mdurl = "0.1.2"
mpmath = "1.3.0"
nest-asyncio = "1.6.0"
networkx = "3.6.1"
nvidia-nvjitlink-cu12 = { version = "12.9.86", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
packaging = "25.0"
parso = "0.8.6"
pexpect = "4.9.0"
platformdirs = "4.9.6"
prompt-toolkit = "3.0.52"
psutil = "7.2.2"
ptyprocess = "0.7.0"
pure-eval = "0.2.3"
pygments = "2.20.0"
pyparsing = "3.3.2"
python-dateutil = "2.9.0.post0"
pyzmq = "27.1.0"
shellingham = "1.5.4"
six = "1.17.0"
stack-data = "0.6.3"
threadpoolctl = "3.6.0"
tornado = "6.5.5"
traitlets = "5.14.3"
typer = "0.24.1"
typing-extensions = "4.15.0"
urllib3 = "2.6.3"
wcwidth = "0.6.0"
widgetsnbextension = "4.0.15"

# ── Optional dependencies (install with: poetry install --extras "ml") ───
# Heavy ML frameworks
tensorflow = { version = "^2.19.0", optional = true }
keras = { version = "^3.11.0", optional = true }

# LangGraph / Agentic workflows
langgraph = { version = "^0.6.7", optional = true }
langgraph-sdk = { version = "^0.2.7", optional = true }
langgraph-prebuilt = { version = "^0.6.4", optional = true }
langgraph-checkpoint = { version = "^2.1.1", optional = true }
langsmith = { version = "^0.4.27", optional = true }

# Additional vector stores
pymilvus = { version = "^2.6.0", optional = true }
qdrant-client = { version = "^1.15.0", optional = true }

# RAG utilities
llama-index-core = { version = "^0.14.0", optional = true }
semantic-router = { version = "^0.1.15", optional = true }
semantic-chunkers = { version = "^0.1.1", optional = true }
bm25s = { version = "^0.2.14", optional = true }

[tool.poetry.extras]
ml = ["tensorflow", "keras"]
agents = ["langgraph", "langgraph-sdk", "langgraph-prebuilt", "langgraph-checkpoint", "langsmith"]
vectorstores = ["pymilvus", "qdrant-client"]
rag = ["llama-index-core", "semantic-router", "semantic-chunkers", "bm25s"]
jupyter-ai = ["jupyter-ai"]
all = [
    "tensorflow", "keras",
    "langgraph", "langgraph-sdk", "langgraph-prebuilt", "langgraph-checkpoint", "langsmith",
    "pymilvus", "qdrant-client",
    "llama-index-core", "semantic-router", "semantic-chunkers", "bm25s",
    "jupyter-ai",
]

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
